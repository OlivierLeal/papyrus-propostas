# Precisa ser solid_cable (não async) mesmo em dev: os broadcasts da IA saem de dentro do worker
# do Solid Queue, que é um processo OS separado do Puma — o adapter async só funciona dentro do
# mesmo processo, então a mensagem nunca chegaria ao navegador (broadcast "com sucesso" no log,
# mas nada no frontend). Usa a mesma tabela solid_cable_messages do banco principal (sem
# connects_to), já carregada no dev — ver "single-database dev setup" no restante deste projeto.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
